<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B3FFF"/>
      <stop offset="50%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#A23FCC"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EBFF"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#5B3FFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#1a0d4d" flood-opacity="0.28"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#FFFFFF" opacity="0.10"/>
  <circle cx="220" cy="230" r="80" fill="#000000" opacity="0.06"/>

  <g filter="url(#softShadow)">
    <!-- Speech bubble holding the A — represents AI giving an answer -->
    <path d="M 50 70
             Q 50 56, 64 56
             L 192 56
             Q 206 56, 206 70
             L 206 178
             Q 206 192, 192 192
             L 110 192
             L 88 216
             L 92 192
             L 64 192
             Q 50 192, 50 178
             Z"
          fill="url(#markGrad)"/>

    <!-- Stylized A letterform -->
    <g transform="translate(0, -2)">
      <path d="M 92 168 L 121 90 L 135 90 L 106 168 Z" fill="url(#aGrad)"/>
      <path d="M 121 90 L 135 90 L 164 168 L 150 168 Z" fill="url(#aGrad)"/>
      <path d="M 121 90 L 135 90 L 132 100 L 124 100 Z" fill="url(#aGrad)"/>
      <rect x="113" y="132" width="30" height="11" rx="2" fill="url(#aGrad)"/>
    </g>

    <!-- Boost chevron above the A -->
    <path d="M 110 78 L 128 60 L 146 78"
          stroke="#A23FCC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Signal dots radiating outward, representing AI answer broadcasts -->
    <circle cx="98" cy="46" r="3.5" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="128" cy="38" r="4" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="158" cy="46" r="3.5" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
